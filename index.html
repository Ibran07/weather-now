<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="./" class="logoContainer" aria-label="Weather Now home" >
            <img src="./assets/images/logo.svg" alt="Weather Now">
        </a>

        <div class="unitContainer">
            <button class="unitsBtn" type="button"
            aria-expanded="false" aria-controls="unitsMenu">
                <img src="./assets/images/icon-units.svg" alt="" aria-hidden="true">
                <span>Units</span>
                <img src="./assets/images/icon-dropdown.svg" alt="" aria-hidden="true">
            </button>

            <div class="unitsMenu" hidden>
                <button class="unitSwitch" type="button">Switch to Imperial</button>

                <div class="unitGroup">
                    <p class="unitGroupTitle">Temperature</p>
                    <button class="unitOption selected" type="button" data-unit-type="Temperature" data-unit="celsius">
                        <span>Celsius (°C)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                    <button class="unitOption" type="button"
                    data-unit-type="temperature" data-unit="fahrenheit">
                        <span>Fahrenheit (°F)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                </div>

                <div class="unitGroup">
                    <p class="unitGroupTitle">Wind Speed</p>
                    <button class="unitOption selected" type="button" data-unit-type="wind" data-unit="kmh">
                        <span>km/h</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>

                    <button class="unitOption" type="button" data-unit-type="wind" data-unit="mph">
                        <span>mph</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                </div>
                
                <div class="unitGroup">
                    <p class="unitGroupTitle">Precipitation</p>
                    <button class="unitOption selected" type="button" data-unit-type="precipitation" data-unit="mm">
                        <span>Millimeters (mm)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>

                    <button class="unitOption" type="button" data-unit-type="precipitation" data-unit="in">
                        <span>Inches (in)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main>

        <!-- API error state -->
        <section class="errorState" hidden>
            <img src="./assets/images/icon-error.svg" alt="" aria-hidden="true">
            <h1>Something went wrong</h1>
            <p id="errorMessage">We couldn't connect to the server (API error). Please try again in a few moments.</p>
            <button class="retryBtn" type="button">
                <img src="./assets/images/icon-retry.svg" alt="" aria-hidden="true">
                <span>Retry</span>
            </button>
        </section>

        <!-- Hero Section -->
        <div class="searchArea">
            <section class="heroContent">
                <h1>How's the sky looking today?</h1>
            </section>

            <form class="search" role="search" autocomplete="off">
                <div class="search-field">
                    <label for="locationSearch" class="searchBox">
                        <span>
                            <img src="./assets/images/icon-search.svg" alt="" aria-hidden="true">
                        </span>
                        <input type="text" id="locationSearch" name="location"
                            placeholder="Search for a place..."
                            autocomplete="off"
                            role="combobox" aria-expanded="false"
                            aria-controls="suggestions"
                            aria-autocomplete="list">
                    </label>
                    <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
                </div>
                <button type="submit" class="submitBtn">Search</button>
            </form>

            <p class="noResult">No search result found!</p>
        </div>
    </main>
</body>
</html>
