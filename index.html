<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="./" class="logoContainer" aria-label="Weather Now home" >
            <img src="./assets/images/logo.svg" alt="Weather Now">
        </a>

        <div class="unitContainer">
            <button class="unitsBtn" type="button"
            aria-expanded="false" aria-controls="unitsMenu">
                <img src="./assets/images/icon-units.svg" alt="" aria-hidden="true">
                <span>Units</span>
                <img src="./assets/images/icon-dropdown.svg" alt="" aria-hidden="true">
            </button>

            <div class="unitsMenu">
                <button class="unitSwitch" type="button">Switch to Imperial</button>

                <div class="unitGroup">
                    <p class="unitGroupTitle">Temperature</p>
                    <button class="unitOption selected" type="button" data-unit-type="Temperature" data-unit="celsius">
                        <span>Celsius (°C)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                    <button class="unitOption" type="button"
                    data-unit-type="temperature" data-unit="fahrenheit">
                        <span>Fahrenheit (°F)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                </div>

                <div class="unitGroup">
                    <p class="unitGroupTitle">Wind Speed</p>
                    <button class="unitOption selected" type="button" data-unit-type="wind" data-unit="kmh">
                        <span>km/h</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>

                    <button class="unitOption" type="button" data-unit-type="wind" data-unit="mph">
                        <span>mph</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                </div>
                
                <div class="unitGroup">
                    <p class="unitGroupTitle">Precipitation</p>
                    <button class="unitOption selected" type="button" data-unit-type="precipitation" data-unit="mm">
                        <span>Millimeters (mm)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>

                    <button class="unitOption" type="button" data-unit-type="precipitation" data-unit="in">
                        <span>Inches (in)</span>
                        <img src="./assets/images/icon-checkmark.svg" alt="" class="unitCheck">
                    </button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
